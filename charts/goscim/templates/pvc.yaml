{{- if and (eq .Values.store.backend "sqlite") .Values.store.sqlite.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "goscim.fullname" . }}-data
  labels:
    {{- include "goscim.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.store.sqlite.persistence.storageClass }}
  storageClassName: {{ .Values.store.sqlite.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.store.sqlite.persistence.size | quote }}
{{- end }}
