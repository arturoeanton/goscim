{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goscim.fullname" . }}
  labels:
    {{- include "goscim.labels" . | nindent 4 }}
type: Opaque
stringData:
  SCIM_BEARER_TOKEN: {{ .Values.auth.bearerToken | quote }}
  SCIM_BEARER_TOKENS: {{ .Values.auth.bearerTokens | quote }}
  SCIM_BASIC_USERS: {{ .Values.auth.basicUsers | quote }}
  SCIM_ADMIN_PASSWORD: {{ .Values.store.couchbase.adminPassword | quote }}
  SCIM_UI_TOKEN: {{ .Values.ui.token | quote }}
  SCIM_METRICS_TOKEN: {{ .Values.metrics.token | quote }}
  SCIM_WEBHOOK_SECRET: {{ .Values.webhooks.secret | quote }}
{{- end }}
