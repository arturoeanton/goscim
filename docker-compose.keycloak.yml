services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8081"
    ports:
      - "8081:8081"
    volumes:
      - ./deploy/keycloak/goscim-realm.json:/opt/keycloak/data/import/goscim-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 3s
      retries: 25
      start_period: 15s

  goscim:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - goscim-sqlite:/data
    environment:
      GIN_MODE: release
      SCIM_PORT: ":8080"
      SCIM_STORE: sqlite
      SCIM_SQLITE_PATH: /data/goscim.db
      SCIM_UI: "true"
      SCIM_UI_TOKEN: ${SCIM_UI_TOKEN:-}
      SCIM_AUTH: ${SCIM_AUTH:-bearer}
      SCIM_BEARER_TOKEN: ${SCIM_BEARER_TOKEN:-keycloak-lab-scim-token}
      SCIM_BEARER_SUBJECT: keycloak-provisioner
      SCIM_BEARER_ROLES: admin,superadmin,user,role1,role2
      SCIM_JWT_JWKS_URL: http://keycloak:8081/realms/goscim-lab/protocol/openid-connect/certs
      SCIM_JWT_ISSUER: http://localhost:8081/realms/goscim-lab
      SCIM_JWT_AUDIENCE: goscim-server
      SCIM_PASSWORD_MODE: argon2id
      SCIM_TRUSTED_PROXIES: none
    restart: unless-stopped

volumes:
  goscim-sqlite:
